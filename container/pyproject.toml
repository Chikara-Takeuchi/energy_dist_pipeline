[project]
name = "e-dist_pipeline"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "pandas==2.2.1",
  "numpy==1.26.4",
  "seaborn==0.13.2",
  "matplotlib==3.8.3",
  "tqdm==4.66.2",
  "scanpy==1.11.3",
  "scikit-learn==1.4.1.post1",
  "scipy==1.12.0",
  "torch==2.3.0",
]

[tool.uv.sources]
torch = [
  # Use the CUDA 12.1 index on Linux/Windows, fall back to PyPI elsewhere (e.g., macOS).
  { index = "pytorch-cu121", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
